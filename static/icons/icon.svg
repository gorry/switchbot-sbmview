<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C83818"/>
      <stop offset="100%" stop-color="#961E0A"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D487C"/>
      <stop offset="100%" stop-color="#0C2448"/>
    </linearGradient>
    <linearGradient id="thermoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
  </defs>

  <!-- 白背景 -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- S と V -->
  <g filter="url(#soft-shadow)">
    <text x="150" y="335" font-family="Arial Black, Segoe UI, Impact, sans-serif" font-weight="900" font-size="230" fill="url(#sGrad)" text-anchor="middle">S</text>
    <text x="362" y="335" font-family="Arial Black, Segoe UI, Impact, sans-serif" font-weight="900" font-size="230" fill="url(#vGrad)" text-anchor="middle">V</text>
  </g>

  <!-- 前面の温度計 -->
  <g filter="url(#shadow)">
    <!-- 白の縁取り -->
    <path d="M 235 85 A 21 21 0 0 1 277 85 L 277 305 A 54 54 0 1 1 235 305 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>

    <!-- 温度計フレーム -->
    <path d="M 236 85 A 20 20 0 0 1 276 85 L 276 305 A 50 50 0 1 1 236 305 Z" fill="#F8FAFC" stroke="#2D3748" stroke-width="10" stroke-linejoin="round"/>

    <!-- 目盛り -->
    <line x1="276" y1="130" x2="292" y2="130" stroke="#2D3748" stroke-width="6" stroke-linecap="round"/>
    <line x1="276" y1="170" x2="300" y2="170" stroke="#2D3748" stroke-width="6" stroke-linecap="round"/>
    <line x1="276" y1="210" x2="292" y2="210" stroke="#2D3748" stroke-width="6" stroke-linecap="round"/>
    <line x1="276" y1="250" x2="300" y2="250" stroke="#2D3748" stroke-width="6" stroke-linecap="round"/>

    <!-- 中の赤液 -->
    <path d="M 246 175 A 10 10 0 0 1 266 175 L 266 310 A 35 35 0 1 1 246 310 Z" fill="url(#thermoGrad)"/>

    <!-- 反射ハイライト -->
    <path d="M 243 95 L 243 275" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 230 335 A 32 32 0 0 1 245 305" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75" fill="none"/>
  </g>
</svg>
